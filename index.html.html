<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Event Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#F5F7FB;--card:#FFFFFF;--ink:#1E2761;--text:#22263A;--mute:#5B6277;--line:#D9DFEC;--teal:#128A84;--tealbg:#DDF3F1;--coral:#E8503F;--gold:#B9770E;--onacc:#FFFFFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1535;--card:#182050;--ink:#E7EBFF;--text:#E1E5F5;--mute:#A3ABCC;--line:#2C3670;--teal:#3CC8BF;--tealbg:#123D4A;--coral:#FF7A6B;--gold:#FFB547;--onacc:#0F1535;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1535;--card:#182050;--ink:#E7EBFF;--text:#E1E5F5;--mute:#A3ABCC;--line:#2C3670;--teal:#3CC8BF;--tealbg:#123D4A;--coral:#FF7A6B;--gold:#FFB547;--onacc:#0F1535;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;line-height:1.1;margin:4px 0 4px;color:var(--ink);font-weight:800}
.sub{margin:0 0 16px;color:var(--mute)}
.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit}
.search:focus,button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tabs{display:flex;border-bottom:2px solid var(--line);margin:14px 0 14px}
.tab{flex:1;padding:10px 4px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--coral)}
.ticket{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.stub{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px;background:var(--tealbg);color:var(--teal);border-right:2px dashed var(--line);text-align:center}
.stub b{font-size:28px;line-height:1;font-weight:800}
.stub span{font-size:13px;font-weight:600}
.stub small{font-size:11px;margin-top:4px;color:var(--mute)}
.body{flex:1;padding:12px 14px;min-width:0}
.body h3{margin:0 0 2px;font-size:18px;color:var(--ink)}
.meta{margin:0 0 6px;font-size:13px;color:var(--mute)}
.desc{margin:0 0 10px;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--tealbg);color:var(--teal);margin-right:6px}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.on{background:var(--coral);border-color:var(--coral);color:var(--onacc)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--onacc)}
.empty{text-align:center;color:var(--mute);padding:36px 12px;border:2px dashed var(--line);border-radius:14px}
form{display:grid;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
label{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--ink)}
input,select,textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>What’s on at campus</h1>
  <p class="sub">Find events by interest, save the ones you like, and post your club’s.</p>
  <input id="q" class="search" type="search" placeholder="Search events, clubs, places" aria-label="Search events">
  <div class="row" id="cats" role="group" aria-label="Interests"></div>
  <div class="row" id="dates" role="group" aria-label="When"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-d" aria-selected="true">Discover</button>
    <button class="tab" role="tab" id="t-s" aria-selected="false">Saved</button>
    <button class="tab" role="tab" id="t-p" aria-selected="false">Post event</button>
  </div>
  <div id="list"></div>
  <form id="post" hidden>
    <label>Event name<input id="f-t" required maxlength="60" placeholder="Intro to Web Dev Workshop"></label>
    <div class="two">
      <label>Interest<select id="f-c"></select></label>
      <label>Club or host<input id="f-h" required maxlength="40" placeholder="Coding Club"></label>
    </div>
    <div class="two">
      <label>Date<input id="f-d" type="date" required></label>
      <label>Time<input id="f-ti" type="time" required value="17:00"></label>
    </div>
    <label>Location<input id="f-l" required maxlength="40" placeholder="Library, Room 2"></label>
    <label>Short description<textarea id="f-ds" rows="2" maxlength="120" placeholder="What should students expect?"></textarea></label>
    <button class="btn pri" type="submit">Publish event</button>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const CATS=["Tech","Music","Sports","Art","Careers"];
const DATES=[["all","Any date"],["today","Today"],["week","This week"]];
const day=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let events=[
 [0,"18:00","Hack night","Tech","Coding Club","Engineering Lab 3","Build something small with snacks and mentors. Beginners welcome."],
 [0,"19:30","Open mic evening","Music","Music Society","Student Union Café","Sign up to perform or just come to listen."],
 [1,"13:00","Internship resume clinic","Careers","Career Cell","Seminar Hall A","Bring a printed resume and get feedback from seniors."],
 [2,"16:30","Inter-hostel football finals","Sports","Sports Council","Main Ground","Come cheer for your hostel."],
 [2,"15:00","Sketching in the quad","Art","Design Club","Central Quad","Bring any sketchbook. Supplies provided for first-years."],
 [3,"11:00","Intro to AI workshop","Tech","AI Society","Computer Centre","Hands-on session on building a simple chatbot."],
 [4,"18:30","Alumni career talk","Careers","Alumni Office","Auditorium","Three alumni share how they got their first jobs."],
 [6,"17:00","Acoustic jam session","Music","Music Society","Amphitheatre","Bring an instrument or your voice."],
 [9,"10:00","Poster design contest","Art","Design Club","Studio 2","Two hours, one theme, prizes for the top three."]
].map((e,i)=>({id:"e"+i,date:iso(day(e[0])),time:e[1],title:e[2],cat:e[3],host:e[4],place:e[5],desc:e[6]}));
let st={cat:"All",when:"all",tab:"d",q:""};
let saved=new Set();
try{saved=new Set(JSON.parse(localStorage.getItem("cef-saved")||"[]"))}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function persist(){try{localStorage.setItem("cef-saved",JSON.stringify([...saved]))}catch(e){}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1800)}
function pill(parent,items,key){
  parent.innerHTML=items.map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${st[key]===v}">${l}</button>`).join("");
  parent.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;st[key]=b.dataset.v;render()};
}
function fmtTime(t){const [h,m]=t.split(":").map(Number);return ((h+11)%12+1)+":"+String(m).padStart(2,"0")+(h<12?" am":" pm")}
function gcal(e){
  const s=e.date.replace(/-/g,"")+"T"+e.time.replace(":","")+"00";
  const [h,m]=e.time.split(":").map(Number);const eh=String((h+1)%24).padStart(2,"0");
  const en=e.date.replace(/-/g,"")+"T"+eh+String(m).padStart(2,"0")+"00";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.title)+"&dates="+s+"/"+en+"&location="+encodeURIComponent(e.place)+"&details="+encodeURIComponent("Hosted by "+e.host);
}
function visible(){
  const t0=iso(day(0)),t7=iso(day(7)),q=st.q.toLowerCase();
  return events.filter(e=>{
    if(st.tab==="s"&&!saved.has(e.id))return false;
    if(st.cat!=="All"&&e.cat!==st.cat)return false;
    if(st.when==="today"&&e.date!==t0)return false;
    if(st.when==="week"&&(e.date<t0||e.date>=t7))return false;
    if(q&&!(e.title+e.host+e.place+e.cat).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function render(){
  pill($("cats"),[["All","All interests"],...CATS.map(c=>[c,c])],"cat");
  pill($("dates"),DATES,"when");
  const post=st.tab==="p";
  $("post").hidden=!post;$("list").hidden=post;
  $("cats").hidden=$("dates").hidden=$("q").hidden=post;
  [["d","Discover"],["s","Saved ("+saved.size+")"],["p","Post event"]].forEach(([k,l])=>{const b=$("t-"+k);b.textContent=l;b.setAttribute("aria-selected",st.tab===k)});
  if(post)return;
  const list=visible();
  if(!list.length){
    $("list").innerHTML=`<div class="empty">${st.tab==="s"?"Nothing saved yet. Tap Save on an event to keep it here.":"No events match. Try another interest or date."}</div>`;return;
  }
  const t0=iso(day(0));
  $("list").innerHTML=list.map(e=>{
    const d=new Date(e.date+"T00:00:00");
    const mon=d.toLocaleDateString("en",{month:"short"}),wd=e.date===t0?"Today":d.toLocaleDateString("en",{weekday:"short"});
    return `<article class="ticket"><div class="stub"><b>${d.getDate()}</b><span>${mon}</span><small>${wd}</small></div>
    <div class="body"><h3>${esc(e.title)}</h3><p class="meta">${fmtTime(e.time)}, ${esc(e.place)}. Hosted by ${esc(e.host)}</p>
    <p class="desc">${esc(e.desc||"")}</p><span class="tag">${esc(e.cat)}</span>
    <div class="acts"><button class="btn ${saved.has(e.id)?"on":""}" data-s="${e.id}" aria-pressed="${saved.has(e.id)}">${saved.has(e.id)?"Saved":"Save"}</button>
    <a class="btn" href="${gcal(e)}" target="_blank" rel="noopener">Add to calendar</a></div></div></article>`}).join("");
}
$("list").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;const id=b.dataset.s;
  if(saved.has(id)){saved.delete(id);toast("Removed from saved")}else{saved.add(id);toast("Saved")}persist();render()};
$("q").oninput=e=>{st.q=e.target.value;render()};
[["d","t-d"],["s","t-s"],["p","t-p"]].forEach(([k,id])=>$(id).onclick=()=>{st.tab=k;render()});
$("f-c").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("f-d").value=iso(day(1));$("f-d").min=iso(day(0));
$("post").onsubmit=e=>{e.preventDefault();
  events.push({id:"u"+Date.now(),date:$("f-d").value,time:$("f-ti").value,title:$("f-t").value.trim(),cat:$("f-c").value,host:$("f-h").value.trim(),place:$("f-l").value.trim(),desc:$("f-ds").value.trim()});
  e.target.reset();$("f-d").value=iso(day(1));$("f-ti").value="17:00";st.tab="d";st.cat="All";st.when="all";render();toast("Published")};
render();
</script>
</body>
</html>
